version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fintech-api-app
    container_name: fintech_api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fintech_db
      DB_USERNAME: fintech_user
      DB_PASSWORD: fintech_secret_password
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - fintech_network

  webserver:
    image: nginx:alpine
    container_name: fintech_api_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fintech_network

  postgres:
    image: postgres:16-alpine
    container_name: fintech_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintech_db
      POSTGRES_USER: fintech_user
      POSTGRES_PASSWORD: fintech_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fintech_network

  redis:
    image: redis:7-alpine
    container_name: fintech_api_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fintech_network

networks:
  fintech_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
